[project]
name = "rhubarb"
version = "0.1.0"
description = "An agentic software development system in Python. Generates full-stack applications across 13 layers and gates each one on tests that actually run."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    # ConPTY backend for `rhubarb.pty_engine`'s interactive session on Windows
    # (issue #84).
    "pywinpty; platform_system == 'Windows'",
    # Unix pty backend for `rhubarb.pty_engine`'s interactive session on
    # macOS/Linux (issue #85), mirroring the Windows-only gating above.
    "ptyprocess; platform_system != 'Windows'",
    # Terminal emulator used to resolve a turn's raw PTY buffer (ANSI
    # escapes, cursor movement, redraws) to its actual final rendered text.
    "pyte",
    # Character-width lookups used directly by `rhubarb.pty_engine` to work
    # around a pyte `Screen.draw` defect (see `_strip_unadvancing_format_
    # characters`) -- already an indirect dependency via pyte, declared
    # explicitly here since pty_engine.py now imports it itself.
    "wcwidth",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
